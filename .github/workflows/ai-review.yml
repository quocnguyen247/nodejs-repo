name: AI Code Review with CodeQL Analysis

permissions:
  contents: read
  pull-requests: write
  security-events: write

on:
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '0 0 * * 0'  # Run once a week on Sunday

jobs:
  codeql-analysis:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 2
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'
          cache: 'npm'
      
      - name: Install dependencies
        run: |
          npm cache clean --force
          npm ci | npm install --force
        env:
           NODE_OPTIONS: --max_old_space_size=8192
      
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
          config-file: ./.github/codeql-config.yml
      
      - name: Build project
        run: |
          # Create node_modules directory if it doesn't exist
          mkdir -p node_modules
          # Create a simple build artifact for demonstration
          echo "console.log('Build artifact created');" > dist-build.js
          npm run build --if-present || echo "No build script found, continuing..."
      
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript"
  
  ai-review:
    name: AI Code Review
    runs-on: ubuntu-latest
    needs: codeql-analysis
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: AI Code Review
        uses: cirolini/genai-code-review@v2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          openai_model: "gpt-3.5-turbo"
          openai_temperature: 0.5
          openai_max_tokens: 2048
          mode: files
          language: en
          custom_prompt: "Review this code for: - Security vulnerabilities - Performance issues - Code style violations - Logic errors"

