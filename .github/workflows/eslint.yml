name: ESLint

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master, ai-review-test ]

jobs:
  eslint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'
          cache: 'npm'
      
      - name: Install ESLint and plugins
        run: |
          npm install --no-save eslint@8.15.0 eslint-plugin-security@1.5.0
      
      - name: Run ESLint
        run: npx eslint src/ --ext .js