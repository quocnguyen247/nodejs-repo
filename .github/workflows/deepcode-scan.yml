name: DeepCode Scan

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master, ai-review-test ]
  schedule:
    - cron: '0 3 * * 0' # Run weekly on Sundays at 3 AM

jobs:
  deepcode-scan:
    name: DeepCode Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Snyk Code Scan
        uses: snyk/actions/code@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: '--severity-threshold=medium --sarif-file-output=snyk-results.sarif'
      
      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-results.sarif