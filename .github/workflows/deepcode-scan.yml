name: DeepCode Scan

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master, ai-review-test ]
  schedule:
    - cron: '0 3 * * 0' # Run weekly on Sundays at 3 AM

jobs:
  deepcode-scan:
    name: DeepCode Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Perform DeepCode analysis
        uses: georgismitev/deepcode-code-scanning-analysis@master
        env:
          DEEPCODE_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Upload report
        uses: github/codeql-action/upload-sarif@v1
        with:
          sarif_file: output.sarif