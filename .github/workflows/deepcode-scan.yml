name: DeepCode Scan

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 3 * * 0' # Run weekly on Sundays at 3 AM

jobs:
  deepcode-scan:
    name: DeepCode Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: DeepCode Scan
        uses: deep-code-ai/actions@v1
        with:
          api-key: ${{ secrets.DEEPCODE_API_KEY }}
          severity-threshold: medium
          report-format: sarif
          output-file: deepcode-results.sarif
      
      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: deepcode-results.sarif