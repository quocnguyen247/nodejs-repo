schemaVersion: '0.3'
description: 'Automated patching of EC2 instances with approval'
assumeRole: '{{AutomationAssumeRole}}'
parameters:
  AutomationAssumeRole:
    type: String
    description: '(Required) The ARN of the role that allows Automation to perform the actions on your behalf.'
  InstanceId:
    type: String
    description: '(Required) The ID of the EC2 instance to patch.'
  ApproverArn:
    type: String
    description: '(Required) The ARN of the user/role that can approve the patching operation.'
  PatchGroup:
    type: String
    description: '(Optional) The patch group to use for patching.'
    default: 'Production'

mainSteps:
  - name: ApprovePatching
    action: 'aws:approve'
    timeoutSeconds: 3600
    inputs:
      Message: 'Please approve patching for instance: {{InstanceId}}'
      MinRequiredApprovals: 1
      Approvers:
        - '{{ApproverArn}}'

  - name: StopInstance
    action: 'aws:changeInstanceState'
    inputs:
      InstanceIds:
        - '{{InstanceId}}'
      DesiredState: stopped
      Force: false

  - name: WaitForInstanceStop
    action: 'aws:waitForAwsResourceProperty'
    inputs:
      Service: ec2
      Api: DescribeInstances
      InstanceIds:
        - '{{InstanceId}}'
      PropertySelector: '$.Reservations[0].Instances[0].State.Name'
      DesiredValues:
        - stopped

  - name: CreateSnapshot
    action: 'aws:executeAwsApi'
    inputs:
      Service: ec2
      Api: CreateSnapshot
      VolumeId: '{{ GetRootVolume.VolumeId }}'
      Description: 'Snapshot before patching instance {{InstanceId}}'
    outputs:
      - Name: SnapshotId
        Selector: '$.SnapshotId'
        Type: String

  - name: GetRootVolume
    action: 'aws:executeAwsApi'
    inputs:
      Service: ec2
      Api: DescribeInstances
      InstanceIds:
        - '{{InstanceId}}'
    outputs:
      - Name: VolumeId
        Selector: '$.Reservations[0].Instances[0].BlockDeviceMappings[0].Ebs.VolumeId'
        Type: String

  - name: StartInstance
    action: 'aws:changeInstanceState'
    inputs:
      InstanceIds:
        - '{{InstanceId}}'
      DesiredState: running

  - name: WaitForInstanceStart
    action: 'aws:waitForAwsResourceProperty'
    inputs:
      Service: ec2
      Api: DescribeInstances
      InstanceIds:
        - '{{InstanceId}}'
      PropertySelector: '$.Reservations[0].Instances[0].State.Name'
      DesiredValues:
        - running

  - name: InstallPatches
    action: 'aws:runCommand'
    inputs:
      DocumentName: AWS-RunPatchBaseline
      InstanceIds:
        - '{{InstanceId}}'
      Parameters:
        Operation: Install
        SnapshotId: '{{CreateSnapshot.SnapshotId}}'
        RebootOption: RebootIfNeeded
        PatchGroup: '{{PatchGroup}}'

  - name: VerifyPatches
    action: 'aws:runCommand'
    inputs:
      DocumentName: AWS-RunPatchBaseline
      InstanceIds:
        - '{{InstanceId}}'
      Parameters:
        Operation: Scan

outputs:
  - CreateSnapshot.SnapshotId